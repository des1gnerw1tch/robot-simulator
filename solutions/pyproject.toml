[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "solutions"
version = "0.1.0"
description = "NATS broker plus example publisher and subscriber"
requires-python = ">=3.14"
dependencies = [
    "nats-py>=2.16.0",
]

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]
